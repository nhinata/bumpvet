# Known vulnerabilities in dev dependencies that cannot be reached here, for
# osv-scanner, which OpenSSF Scorecard runs (Vulnerabilities). Ignored by ID,
# so that a new advisory for the same package shows again, and each until a
# date to look at it again. The key is `ignoreUntil` as osv-scanner v2.5.1
# reads it; a key it does not know makes it ignore the whole file.
#
# tar 6.2.1 (`tar6`): test/tarball.test.ts runs node-tar's parser, `t()`, on
# tarballs the tests build or keep in test/fixtures, and writes nothing to
# disk. It is kept to read tarballs as npm up to 10.9.5 does (DESIGN.md, Threat
# model), which Node.js 22 shipped; Node.js 22 reaches end of life on
# 2027-04-30.

[[IgnoredVulns]]
id = "GHSA-23hp-3jrh-7fpw"
ignoreUntil = 2027-04-30
reason = "tar 6 parses only the tests' own tarballs, in memory."

