name: Test package

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check (Node.js ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          # No dependency cache: installs are fast, and a cache is one more thing to poison.
          package-manager-cache: false
      # .npmrc keeps dependencies' install scripts from running.
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # test/tarball.test.ts checks the reading of tarballs against the node-tar
      # majors in devDependencies; the npm of this Node.js has to unpack with one.
      - name: Check that the tests cover this npm's node-tar
        run: |
          node -e '
            const { join } = require("node:path");
            const npm = require(join(process.argv[1], "npm/package.json")).version;
            const npmTar = require(join(process.argv[1], "npm/node_modules/tar/package.json")).version;
            const tested = Object.values(require("./package.json").devDependencies)
              .flatMap((v) => /^npm:tar@(\d+)\./.exec(v)?.[1] ?? []);
            const major = npmTar.split(".")[0];
            if (!tested.includes(major)) {
              console.error(`npm ${npm} unpacks with node-tar ${npmTar}; the tests cover majors ${tested.join(", ")}`);
              process.exit(1);
            }
            console.log(`node-tar ${npmTar}: covered`);
          ' "$(npm root -g)"
      - run: npm run build
      # The built entry point starts and parses arguments.
      - run: node dist/cli.js --help
      # The package as npm would publish it installs, and its command starts.
      - run: npx --yes --package "./$(npm pack --silent)" bumpvet --help
