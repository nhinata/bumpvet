name: Release

# Merging a pull request that bumps the version (feat:, fix:, a breaking change;
# see CONTRIBUTING.md, Pull requests) makes release-please open or update a
# release pull request. It changes only the version in package.json,
# package-lock.json, .github/release-please-manifest.json and action.yml, and
# CHANGELOG.md. Merging that tags v<version> and creates the GitHub release;
# the jobs below then build, test and publish it to npm with provenance, and
# test the action with the version just published. Nothing is published from a
# laptop.
#
# Run by hand (Run workflow on main, with the tag) to publish a tag again after
# a failure outside the tagged code, such as the npm settings. If the tagged
# code is at fault, release a new version instead.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, e.g. v1.2.3
        required: true

permissions: {}

# One release at a time, and never cancel one halfway.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # GITHUB_TOKEN: CI on the release pull request waits for approval.
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json

  # Dependency code (TypeScript, vitest) runs only in build and test, which
  # cannot publish. publish runs none of it, and publishes only the tarball
  # build made: the commit and the tarball's SHA-256 are build's outputs, which
  # later jobs cannot change.
  build:
    needs: release-please
    if: >-
      !cancelled() && needs.release-please.result != 'failure' &&
      (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
    outputs:
      node: ${{ steps.node.outputs.node-version }}
      sha: ${{ steps.commit.outputs.sha }}
      file: ${{ steps.pack.outputs.file }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - name: Check the tag
        run: '[[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a release tag: $TAG"; exit 1; }'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - id: commit
        name: Check the commit
        run: |
          # By hand, only from main's own workflow, and only for a commit on main.
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$GITHUB_REF" == refs/heads/main ]] || { echo "run it on main, not $GITHUB_REF"; exit 1; }
            git fetch --quiet origin main
            git merge-base --is-ancestor HEAD FETCH_HEAD || { echo "$TAG is not on main"; exit 1; }
          fi
          [[ "v$(node -p 'require("./package.json").version')" == "$TAG" ]] || { echo "package.json does not have $TAG"; exit 1; }
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Check the version against npm
        run: |
          [[ -z "$(npm view "bumpvet@${TAG#v}" version 2>/dev/null)" ]] || { echo "${TAG#v} is already on npm"; exit 1; }
          # npm publish moves `latest` to what it publishes.
          latest=$(npm view bumpvet version)
          node -e '
            const [a, b] = process.argv.slice(1).map((v) => v.split(".").map(Number));
            const cmp = a.map((n, i) => n - b[i]).find((d) => d !== 0) ?? 0;
            if (cmp < 0) { console.error(`${process.argv[1]} is older than latest ${process.argv[2]}`); process.exit(1); }
          ' "${TAG#v}" "$latest"
      # .npmrc keeps install scripts from running, so the build is a step of its own.
      - run: npm ci
      - run: npm run build
      - id: pack
        run: |
          mkdir -p "$RUNNER_TEMP/package"
          file=$(npm pack --silent --pack-destination "$RUNNER_TEMP/package")
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$RUNNER_TEMP/package/$file" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      # The tarball as it will be published installs, and its command starts.
      - run: npx --yes --package "$RUNNER_TEMP/package/$FILE" bumpvet --help
        env:
          FILE: ${{ steps.pack.outputs.file }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package/${{ steps.pack.outputs.file }}
          if-no-files-found: error
          retention-days: 7

  # Separate from build, so that the test tools never touch what is published.
  test:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci
      - run: npm test

  publish:
    needs: [build, test]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.test.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Deployments to `npm` are limited to main (repository settings), and npm's
    # trusted publisher accepts this environment only.
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing
    steps:
      # No checkout: only the tarball build made is used.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ needs.build.outputs.node }}
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package
      - run: |
          echo "$SHA256  $RUNNER_TEMP/package/$FILE" | sha256sum --check --strict
          npm publish "$RUNNER_TEMP/package/$FILE"
        env:
          FILE: ${{ needs.build.outputs.file }}
          SHA256: ${{ needs.build.outputs.sha256 }}

  # The action at the released commit, now that the version it names is on npm.
  test-action:
    name: test action
    needs: [build, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    permissions:
      contents: read
    uses: ./.github/workflows/test-action.yml
    with:
      ref: ${{ needs.build.outputs.sha }}
