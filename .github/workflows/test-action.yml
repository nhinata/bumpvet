name: Test action

# Runs the action against lockfile changes whose verdict is known, and checks
# its exit code and that it passes or fails the job as README says. bumpvet
# comes from npm, at the version action.yml names, and reads the live registry;
# the fixtures are old releases whose registry data no longer changes.
on:
  pull_request:
    paths:
      - action.yml
      - test/action/**
      - .github/workflows/test-action.yml
  # From release.yml, once the version action.yml names is on npm.
  workflow_call:
    inputs:
      ref:
        description: Commit to test the action at.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: test-action-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  vet:
    name: vet (${{ matrix.name }})
    # release-please's pull request names a version that is published only
    # after it is merged; release.yml runs this then.
    if: github.head_ref != 'release-please--branches--main--components--bumpvet'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # ms 2.1.2 -> 2.1.3
          - name: OK
            case: ok
            exit-code: 0
            outcome: success
          # pino 9.13.1 -> 9.14.0: provenance-lost
          - name: REVIEW
            case: review
            exit-code: 0
            outcome: success
          # ms 2.1.2 -> 2.1.3 with 2.1.2's integrity: integrity-mismatch
          - name: BLOCK
            case: block
            exit-code: 1
            outcome: failure
          # HEAD^1 missing: bumpvet cannot vet, an error
          - name: no base commit
            case: no-parent
            exit-code: 2
            outcome: failure
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Make a repository with the lockfile change
        env:
          CASE: ${{ matrix.case }}
          REPO: ${{ runner.temp }}/repo
        run: |
          git init -q "$REPO"
          commit() { git -C "$REPO" -c user.name=test -c user.email=test@example.com commit -q --allow-empty -m "$1"; }
          if [[ "$CASE" != no-parent ]]; then
            cp "test/action/$CASE/base.json" "$REPO/package-lock.json"
            git -C "$REPO" add package-lock.json
            commit base
            cp "test/action/$CASE/head.json" "$REPO/package-lock.json"
          else
            cp test/action/ok/head.json "$REPO/package-lock.json"
          fi
          git -C "$REPO" add package-lock.json
          commit head
      # From release.yml, right after publishing: npm makes a version
      # installable a few minutes after accepting it, and answers ETARGET until
      # then (v0.2.0, 2026-10-26: about two minutes). --prefer-online: npm would otherwise reuse the metadata it cached
      # on the first try, without the version.
      - name: Wait until npm can install the version action.yml names
        if: github.event_name != 'pull_request'
        run: |
          version=$(sed -n 's/^ *BUMPVET_VERSION: \([^ ]*\) .*/\1/p' action.yml)
          [[ -n "$version" ]] || { echo "no BUMPVET_VERSION in action.yml"; exit 1; }
          cd "$(mktemp -d -p "$RUNNER_TEMP")"
          echo '{"private": true}' > package.json
          tries=16
          for try in $(seq "$tries"); do
            if npm install --ignore-scripts --no-audit --no-fund --prefer-online \
              --registry=https://registry.npmjs.org/ "bumpvet@$version" > /dev/null 2> npm-error.log; then
              exit 0
            fi
            grep -q 'code ETARGET' npm-error.log || break
            if (( try < tries )); then
              echo "bumpvet@$version is not installable from npm yet; trying again in 20 seconds"
              sleep 20
            fi
          done
          cat npm-error.log >&2
          exit 1
      - id: vet
        uses: ./
        continue-on-error: true
        with:
          working-directory: ${{ runner.temp }}/repo
          # The default, HEAD^1, applies on pull_request only.
          base: ${{ github.event_name != 'pull_request' && 'HEAD^1' || '' }}
      - name: Check the outcome
        env:
          WANT_CODE: ${{ matrix.exit-code }}
          GOT_CODE: ${{ steps.vet.outputs.exit-code }}
          WANT: ${{ matrix.outcome }}
          GOT: ${{ steps.vet.outcome }}
        run: |
          echo "exit code: $GOT_CODE, expected: $WANT_CODE"
          echo "outcome: $GOT, expected: $WANT"
          [[ "$GOT_CODE" == "$WANT_CODE" && "$GOT" == "$WANT" ]]
