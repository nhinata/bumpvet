name: bumpvet

# Vets the dependency changes of a pull request with the action in this
# repository, as other repositories use it. BLOCK fails the job and REVIEW adds
# a warning; what to do about either is in README, "When bumpvet says BLOCK or
# REVIEW". Not a required check yet.
on:
  pull_request:
    paths:
      - package-lock.json
      - .github/workflows/bumpvet.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vet:
    name: bumpvet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pr
          fetch-depth: 2
          persist-credentials: false
      # The action is taken from the base branch, so changes a pull request
      # makes to action.yml or to the version it installs do not change its
      # verdict. (Changes to this workflow do, as for every workflow here; they
      # show in the pull request's diff.) For a few minutes after a release
      # pull request is merged, the version it names may not be on npm yet;
      # rerun the job if installing it fails.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: base
          ref: ${{ github.base_ref }}
          persist-credentials: false
      - uses: ./base
        with:
          working-directory: pr
