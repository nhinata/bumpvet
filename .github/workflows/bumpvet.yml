name: bumpvet

# Vets the dependency changes of a pull request with bumpvet itself.
# Not a required check yet (see README, "When bumpvet says BLOCK or REVIEW").
on:
  pull_request:
    paths:
      - package-lock.json
      - .github/workflows/bumpvet.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vet:
    name: bumpvet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The pull request, with history so its lockfile can be compared with the base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pr
          fetch-depth: 0
          persist-credentials: false
      # bumpvet is built from the base branch, not from the pull request, so a
      # pull request cannot change the tool that vets it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: base
          ref: ${{ github.base_ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: base/.nvmrc
          package-manager-cache: false
      - name: Build bumpvet from the base branch
        working-directory: base
        run: npm ci && npm run build
      - name: Vet the lockfile change
        working-directory: pr
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set +e
          node ../base/dist/cli.js --base "origin/$BASE_REF" > ../report.txt 2>&1
          code=$?
          set -e
          cat ../report.txt
          {
            echo "### bumpvet"
            echo
            echo '```'
            cat ../report.txt
            echo '```'
            echo
            echo "Exit code $code (0: nothing to block, 1: at least one BLOCK, 2: error)."
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
