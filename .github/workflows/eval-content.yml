name: Evaluate content

# Groundwork for content signals (issue #44): which kinds of code malicious
# releases added, and how often benign updates add the same kinds. Both tables
# go to the run's summary.
#
# The malicious samples are real malware, read as text and never run. They
# are unzipped only inside a container with no network, no capabilities, a
# read-only root and an unprivileged user, into memory that is dropped with
# the container. The job holds no secrets, and its token can only read this
# public repository.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  malicious:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      # .npmrc keeps dependencies' install scripts from running.
      - run: npm ci
      - run: npx tsc -p tsconfig.json
      - run: node dist-eval/eval/content-malicious.js fetch "$RUNNER_TEMP/samples"
      - name: Scan the samples without network
        run: |
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            --read-only --user 1000:1000 --tmpfs /work:rw,noexec,nosuid,nodev,size=1g \
            -v "$PWD:/app:ro" -v "$RUNNER_TEMP/samples:/in:ro" -w /app \
            node:24-bookworm@sha256:6449e19d8184d84062525b6a7524def03146c2cb04a7f08b076680d0e8e4240a \
            sh -ec '
              for zip in /in/zips/*.zip; do
                id=$(basename "$zip" .zip)
                mkdir "/work/$id"
                unzip -q -P infected "$zip" -d "/work/$id"
              done
              node dist-eval/eval/content-malicious.js scan /in /work
            ' >> "$GITHUB_STEP_SUMMARY"

  benign:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm run --silent eval:content >> "$GITHUB_STEP_SUMMARY"
