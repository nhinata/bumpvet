name: Scorecard

# OpenSSF Scorecard's checks of this repository's practices, published to
# api.scorecard.dev for scorecard.dev/viewer. The API accepts results only from
# a workflow that keeps its rules: no workflow-level env, defaults or write
# permissions, and only approved actions in the job (ossf/scorecard-action,
# README, Workflow Restrictions). A rejection does not fail the job: the action
# only adds a warning annotation (ossf/scorecard-action v2.5.0,
# signing/signing.go).
on:
  push:
    branches: [main]
  schedule:
    - cron: '30 3 * * 1'

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Signs the results it publishes.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.json
          results_format: json
          publish_results: true
