# yaml-language-server: $schema=https://www.coderabbit.ai/integrations/schema.v2.json
# Settings not listed here keep CodeRabbit's defaults (reviews.profile: chill).
knowledge_base:
  code_guidelines:
    # AGENTS.md is read by default; the rules for writing code are in CONTRIBUTING.md.
    filePatterns:
      - CONTRIBUTING.md
reviews:
  auto_review:
    # Pull requests that workflows open with generated changes only: the
    # release (release.yml) and the README action example (update-readme.yml).
    ignore_title_keywords:
      - 'chore(main): release'
      - 'docs: point the README action example at'
